{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>仪表盘</h2>
  <div class="grid">
    <div><strong>{{ data.accounts }}</strong><br><span class="muted">账户</span></div>
    <div><strong>{{ data.active_accounts }}</strong><br><span class="muted">活跃账户</span></div>
    <div><strong>{{ data.chats }}</strong><br><span class="muted">群组/频道</span></div>
    <div><strong>{{ data.rules }}</strong><br><span class="muted">规则</span></div>
    <div><strong>{{ data.leads }}</strong><br><span class="muted">线索</span></div>
    <div><strong>{{ data.pending }}</strong><br><span class="muted">待发送</span></div>
  </div>
</div>
<div class="card">
  <form class="inline" method="post" action="/workers/start"><button>启动 Worker</button></form>
  <form class="inline" method="post" action="/workers/stop"><button class="secondary">停止 Worker</button></form>
  <p class="muted">生产环境可用 AUTO_START_TELEGRAM_WORKERS=true 自动启动。</p>
</div>
{% endblock %}
