{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>验证登录：{{ account.name }}</h2>
  <form method="post" action="/accounts/{{ account.id }}/verify">
    <label>验证码<input name="code" required></label>
    <label>二步验证密码（如有）<input name="password" type="password"></label>
    <button>完成登录</button>
  </form>
</div>
{% endblock %}
