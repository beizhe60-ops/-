<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Telegram Ops</title><link rel="stylesheet" href="/static/console.css"></head><body class="login-body"><main class="login-card"><div class="brand"><span class="brand-icon">↗</span><span>Telegram Ops<small>消息工作台</small></span></div><h1>登录工作空间</h1><p>管理账号、群消息与自动私信任务。</p><form method="post" action="/admin/login"><label>管理员账号<input name="username" autocomplete="username" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><input type="hidden" name="next" value="{{ next or '/console' }}">{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}<button type="submit">进入工作台</button></form><p style="margin-top:25px">首次部署的登录信息保存在服务器的 .local-access.json。</p></main></body></html>
